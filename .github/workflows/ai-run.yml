name: AI免费模型调用
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install openai

      - name: 运行AI免费模型
        env:
          API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
        run: python ai_test.py
